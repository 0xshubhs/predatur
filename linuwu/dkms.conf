# Upstream ships a plain `make install` that drops a .ko straight into
# /lib/modules — which dies on the next kernel upgrade, and is refused
# outright under Secure Boot. DKMS rebuilds and re-signs it per kernel.
PACKAGE_NAME="linuwu-sense"
PACKAGE_VERSION="2.0.0"

BUILT_MODULE_NAME[0]="linuwu_sense"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"
