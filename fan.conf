# PredatorTune automatic fan curve.
#
# The daemon reads the CPU package temperature, and the dGPU's too when the
# GPU is already awake, then drives both fans from whichever is hotter.
# Edit and run:  sudo systemctl reload predatortune-daemon
#
# curve <temp_c> <cpu_fan_%> <gpu_fan_%>
#
# Below the first point the fans are handed back to the firmware's own auto
# mode, which is quieter at idle than anything we can ask for explicitly.
# Points are interpolated, so the ramp is smooth rather than steppy.

poll_seconds  3

# Follow a temperature rise at once, but wait for a fall of this many degrees
# before slowing down. Without it, normal noise makes the fans surge audibly.
hysteresis_c  4

# Custom mode can drive a fan almost to a stop, which is worse than auto.
# Never ask for less than this once we are controlling the fans at all.
min_percent   20

curve 55  25 25
curve 65  40 40
curve 75  60 60
curve 83  80 80
curve 90 100 100
