# Built by DKMS against whatever kernel is running, and rebuilt automatically
# on every kernel upgrade. Without this the .ko only matches the kernel it was
# compiled on, which is why the module kept disappearing after updates.
PACKAGE_NAME="predatortune"
PACKAGE_VERSION="2.0.0"

BUILT_MODULE_NAME[0]="predatortune_fan"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"
