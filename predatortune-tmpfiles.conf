# linuwu_sense exposes these root-only. The tray and the window are ordinary
# user programs, and routing every fan tweak or colour change through pkexec
# means a password prompt for each one — which is exactly the annoyance this
# package exists to remove.
#
# 0666 matches what the old udev rule already did for fan_speed. The worst a
# local user can do here is make the laptop loud, change the keyboard colour,
# or cap their own charging.
#
# The daemon runs as root and does not depend on any of this.
z /sys/devices/platform/acer-wmi/predator_sense/fan_speed            0666 root root
z /sys/devices/platform/acer-wmi/predator_sense/battery_limiter      0666 root root
z /sys/devices/platform/acer-wmi/predator_sense/battery_calibration  0666 root root
z /sys/devices/platform/acer-wmi/predator_sense/backlight_timeout    0666 root root
z /sys/devices/platform/acer-wmi/predator_sense/usb_charging         0666 root root
z /sys/devices/platform/acer-wmi/predator_sense/lcd_override         0666 root root
z /sys/devices/platform/acer-wmi/predator_sense/boot_animation_sound 0666 root root
z /sys/devices/platform/acer-wmi/four_zoned_kb/four_zone_mode        0666 root root
z /sys/devices/platform/acer-wmi/four_zoned_kb/per_zone_mode         0666 root root
